services:
  nginx:
    image: nginx:latest
    container_name: camagru-nginx
    # The public/app/config/vendor dirs are bind-mounted from a Kerberos-secured
    # NFS4 share (sgoinfre); its ACLs only recognize the host user's identity,
    # so nginx's default unprivileged "nginx" worker user can't read anything
    # under it. Force the worker to run as root instead of patching every file.
    command: ["sh", "-c", "sed -i 's/^user  *nginx;/user root;/' /etc/nginx/nginx.conf && exec nginx -g 'daemon off;'"]
    ports:
      - "8080:80"
    volumes:
      - ../public:/var/www/html/public
      - ../app:/var/www/html/app
      - ../config:/var/www/html/config
      - ../vendor:/var/www/html/vendor
      - uploads-data:/var/www/html/public/uploads
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - camagru

  php:
    build: ./php
    container_name: camagru-php
    # -R: php-fpm refuses to run the pool as root unless told to; see the
    # Dockerfile comment above the www.conf patch for why it has to be root.
    command: ["php-fpm", "-R"]
    env_file:
      - .env
    volumes:
      - ../:/var/www/html
      - uploads-data:/var/www/html/public/uploads
    working_dir: /var/www/html
    depends_on:
      db:
        condition: service_healthy
        restart: true
    networks:
      - camagru
    secrets:
      - db_password
      - db_user
      - db_name
      - smtp_password
      - smtp_mail

  # Quick tunnel de Cloudflare (sin cuenta): publica nginx en una URL
  # https://*.trycloudflare.com aleatoria. Solo arranca con `make cloud`.
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: camagru-tunnel
    command: ["tunnel", "--no-autoupdate", "--url", "http://nginx:80"]
    profiles: ["cloud"]
    depends_on:
      - nginx
    networks:
      - camagru

  db:
    build: ./mysql
    container_name: camagru-db
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MYSQL_USER_FILE: /run/secrets/db_user
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_DATABASE_FILE: /run/secrets/db_name
    ports:
      - "33006:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$$MYSQL_ROOT_PASSWORD_FILE"] 
      start_period: 10s
      timeout: 5s
      retries: 10
    networks:
      - camagru
    secrets:
      - db_password
      - db_user
      - db_root_password
      - db_name

volumes:
  db-data:
  uploads-data:

networks:
  camagru:
    driver: bridge

secrets:
  db_password:
    file: ./secrets/db_password.secret
  db_user:
    file: ./secrets/db_user.secret
  db_name:
    file: ./secrets/db_name.secret
  db_root_password:
    file: ./secrets/db_root_password.secret
  smtp_password:
    file: ./secrets/smtp_password.secret
  smtp_mail:
    file: ./secrets/smtp_mail.secret
