services:
  nginx:
    image: nginx:latest
    container_name: camagru-nginx
    ports:
      - "8080:80"
    volumes:
      - ../public:/var/www/html/public
      - ../app:/var/www/html/app
      - ../config:/var/www/html/config
      - ../vendor:/var/www/html/vendor
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - camagru

  php:
    build: ./php
    container_name: camagru-php
    env_file:
      - .env
    volumes:
      - ../:/var/www/html
    working_dir: /var/www/html
    depends_on:
      db:
        condition: service_healthy
        restart: true
    networks:
      - camagru
    secrets:
      - db_password
      - db_user
      - db_name

  db:
    image: mysql:latest
    container_name: camagru-db
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MYSQL_USER_FILE: /run/secrets/db_user
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_DATABASE_FILE: /run/secrets/db_name
    ports:
      - "33006:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./mysql/init.sh:/docker-entrypoint-initdb.d/init.sh
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$$MYSQL_ROOT_PASSWORD_FILE"] 
      start_period: 5s
      timeout: 5s
      retries: 10
    networks:
      - camagru
    secrets:
      - db_password
      - db_user
      - db_root_password
      - db_name

volumes:
  db-data:

networks:
  camagru:
    driver: bridge

secrets:
  db_password:
    file: ./secrets/db_password
  db_user:
    file: ./secrets/db_user
  db_name:
    file: ./secrets/db_name
  db_root_password:
    file: ./secrets/db_root_password