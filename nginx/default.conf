server {
	listen      80;

	server_name localhost camagru;
	root /var/www/html;
	index index.html;


	location / {
        alias     /var/www/html/;
        try_files $uri $uri/ /index.html =404;
    }

    location /api/ {
    	proxy_pass http://server:9000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
