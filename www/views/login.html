<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Login</title>
        <link rel="stylesheet" href="../styles/auth.css">
        <script async src="../shared/js/auth.js"></script>
    </head>
    <body>
        <div class="login-box">
            <h3>Login</h3>
            <input type="text" id="username" placeholder="Usuario" required />
            <input type="password" id="password" placeholder="Contraseña" required />
            <button onblur="document.addEventListener('keydown', (event) => { if (event.key === 'Enter') {login();}});"
                onclick="login()">Entrar</button>
            <p id="message"></p>
        </div>
    </body>
</html>
