
services:
  nginx:
    container_name: frontend
    image: nginx:latest
    ports:
      - "8000:8000"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/html:/var/www/html
    networks:
      - frontend
    # depends_on:
    #   server:
    #     condition: service_healthy
    #     restart: true

  database:
    image: mysql
    restart: always
    env_file:
      - ".env"
    container_name: database
    networks:
      - backend
    volumes:
      - ./data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$$MYSQL_ROOT_PASSWORD"] 
      start_period: 5s
      timeout: 20s
      retries: 10

  server:
    build: "./api"
    env_file:
      - ".env"
    container_name: server
    networks:
      - backend
      - frontend
    depends_on:
      database:
        condition: service_healthy
        restart: true
    volumes:
      - ./api:/app/camagru
    ports:
      - "9000:9000"
    # healthcheck:
    #   test: curl -f http://localhost/api/ || exit 1
    #   interval: 60s
    #   start_period: 10s
    #   retries: 3
    #   timeout: 5s
    develop:
      watch:
        - action: rebuild
          path: .env


networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge

volumes:
  db-data:
