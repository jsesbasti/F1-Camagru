
services:
  database:
    image: mysql
    restart: always
    env_file:
      - ".env"
    container_name: database
    networks:
      - backend
    volumes:
      - ./data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysql", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD", "--execute", "SELECT 1;"]
      start_period: 5s
      timeout: 20s
      retries: 10

  server:
    build: "./srv"
    env_file:
      - ".env"
    ports:
      - "3000:3000"
    container_name: server
    networks:
      - backend
      - frontend
    depends_on:
      database:
        condition: service_healthy
        restart: true
    develop:
      watch:
        - action: sync
          path: ./www
          target: /usr/src/web
          initial_sync: true
        - action: rebuild
          path: .env


  frontend:
    build: "./www/"
    ports:
      - "8000:8000"
    container_name: frontend
    networks:
      - frontend
    develop:
      watch:
        - action: sync
          path: ./www
          target: /usr/src/web
          initial_sync: true


networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge

volumes:
  db-data:
