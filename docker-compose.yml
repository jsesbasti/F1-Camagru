
services:
  database:
    image: mysql
    restart: always
    env_file:
      - ".env"
    container_name: database
    networks:
      - backend
    volumes:
      - ./data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$$MYSQL_ROOT_PASSWORD"] 
      start_period: 5s
      timeout: 20s
      retries: 10

  server:
    build: "./srv"
    env_file:
      - ".env"
    ports:
      - "3000:3000"
    container_name: server
    networks:
      - backend
      - frontend
    depends_on:
      database:
        condition: service_healthy
        restart: true
    develop:
      watch:
        - action: sync
          path: ./srv
          target: /usr/src/myapp
          # initial_sync: true
        - action: rebuild
          path: .env

  nginx:
      image: nginx:stable
      container_name: nginx
      ports:
        - "${NGINX_HTTP_PORT}:80"
        - "${NGINX_HTTPS_PORT}:443"
      volumes:
        - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
        - ./nginx/certbot/conf:/etc/letsencrypt
        - ./client:/usr/share/nginx/html:ro
      depends_on:
        - server
      networks:
        - frontend

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge

volumes:
  db-data:
  server_data:
